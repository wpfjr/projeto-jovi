<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JOVI Smart Capture</title>
  <link href="assets/bootstrap.min.css" rel="stylesheet">
  <link href="assets/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/base.css" rel="stylesheet">
  <link href="css/camera.css" rel="stylesheet">
  <link href="css/gallery.css" rel="stylesheet">
  <link href="css/edit.css" rel="stylesheet">
  <link href="css/overlays.css" rel="stylesheet">
  <link href="css/overrides.css" rel="stylesheet">
</head>

<body>

  <div id="app">

    <!-- TELA: CÂMERA -->
    <div class="screen active" id="screen-camera">
      <div class="camera-viewfinder">

        <!-- HUD Superior -->
        <div class="cam-hud-top d-flex justify-content-between align-items-center">
          <div class="cam-status d-flex align-items-center" id="cam-status">
            <span class="cam-status-dot" id="cam-dot"></span>
            <span class="cam-status-text" id="cam-status-text">PRONTO</span>
          </div>
          <div class="cam-top-actions d-flex">
            <button class="btn cam-icon-btn" id="btn-flash" title="Flash" aria-label="Desativar flash"
              aria-pressed="true">
              <i class="bi bi-lightning-charge-fill"></i>
            </button>
            <button class="btn cam-icon-btn" id="btn-camera-grid" title="Ativar grade" aria-label="Ativar grade"
              aria-pressed="false">
              <i class="bi bi-aspect-ratio"></i>
            </button>
          </div>
        </div>

        <div class="camera-grid hidden" id="camera-grid" aria-hidden="true"></div>

        <!-- Overlay de foco (moldura verde) -->
        <div class="focus-frame" id="focus-frame">
          <div class="focus-corner tl"></div>
          <div class="focus-corner tr"></div>
          <div class="focus-corner bl"></div>
          <div class="focus-corner br"></div>
          <div class="focus-center-dot"></div>
        </div>

        <!-- Modos de captura -->
        <div class="cam-modes d-flex">
          <button class="btn cam-mode" data-mode="video">VÍDEO</button>
          <button class="btn cam-mode active" data-mode="foto">FOTO</button>
          <button class="btn cam-mode" data-mode="pro">PRO</button>
        </div>

        <!-- Controles inferiores -->
        <div class="cam-controls d-flex align-items-center justify-content-around">
          <button class="btn cam-thumb-btn" id="btn-cam-to-gallery" title="Ir para galeria">
            <img id="cam-thumb-img" src="" alt="Última captura" class="img-fluid">
          </button>

          <button class="btn cam-capture-btn" id="btn-capture" aria-label="Capturar foto">
            <div class="cam-capture-ring"></div>
          </button>

          <button class="btn cam-flip-btn" id="btn-flip-cam" title="Virar câmera" aria-label="Virar câmera">
            <i class="bi bi-arrow-repeat"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- TELA: GALERIA -->
    <div class="screen" id="screen-gallery">

      <!-- Header fixo -->
      <div class="gal-header" id="gal-header">
        <div class="gal-header-row d-flex justify-content-between align-items-center">
          <button class="btn gal-back-btn" id="btn-gallery-back" aria-label="Voltar para câmera"><i
              class="bi bi-chevron-left"></i></button>
          <div class="gal-brand">Galeria</div>
          <button class="btn gal-select-btn" id="btn-select">Selecionar</button>
        </div>
        <div class="gal-tabs d-flex w-100" id="gal-tabs">
          <button class="btn gal-tab active" data-filter="tudo">Tudo</button>
          <button class="btn gal-tab" data-filter="fotos">Foto</button>
          <button class="btn gal-tab" data-filter="videos">Vídeo</button>
          <button class="btn gal-tab" data-filter="favoritos">Favoritos</button>
        </div>

        <!-- Busca + ordenação -->
        <div class="gal-search-row d-flex align-items-center gap-2">
          <div class="gal-search-box d-flex align-items-center flex-grow-1">
            <i class="bi bi-search"></i>
            <input type="text" class="form-control gal-search-input" id="search-input" placeholder="Buscar por nome">
            <button class="btn gal-search-clear hidden" id="btn-search-clear">
              <i class="bi bi-x"></i>
            </button>
          </div>
          <button type="button" class="btn gal-sort-btn" id="btn-sort" title="Mais recentes"
            aria-label="Ordenar: mais recentes">
            <i class="bi bi-sort-down" id="sort-icon"></i>
          </button>
        </div>

        <div class="gal-meta-row d-flex justify-content-between"><span id="gal-count">20 itens</span><span
            id="gal-sort-label">Mais recentes</span></div>
      </div>

      <!-- Grade de mídia -->
      <div class="gal-grid" id="gal-grid"></div>

      <!-- Estado vazio -->
      <div class="gal-empty hidden d-flex flex-column align-items-center justify-content-center text-center"
        id="gal-empty">
        <i class="bi bi-images"></i>
        <p>Nenhum item encontrado</p>
      </div>

      <!-- Barra de ações contextual (modo seleção) -->
      <div class="ctx-bar hidden d-flex align-items-center justify-content-between gap-3" id="ctx-bar">
        <div class="ctx-bar-info"><strong id="ctx-bar-info">0 selecionados</strong><small>Ações em lote
            disponíveis</small></div>
        <div class="ctx-bar-actions d-flex flex-wrap justify-content-end gap-2" id="ctx-bar-actions"></div>
      </div>

    </div>

    <!-- TELA: EDIÇÃO -->
    <div class="screen" id="screen-edit">

      <div class="edit-header d-flex align-items-center justify-content-between">
        <button class="btn edit-back-btn" id="btn-edit-back" aria-label="Voltar para galeria">
          <i class="bi bi-arrow-left"></i>
        </button>
        <span class="edit-title">Editar</span>
        <button class="btn edit-save-btn" id="btn-edit-save">Salvar</button>
      </div>

      <div class="edit-canvas d-flex align-items-center justify-content-center">
        <div class="edit-img-wrap" id="edit-img-wrap">
          <img id="edit-img" src="" alt="Imagem em edição" class="edit-img">
          <div class="edit-grid-overlay hidden" id="edit-grid-overlay"></div>
          <div class="edit-crop-overlay hidden" id="edit-crop-overlay">
            <div class="crop-handle tl"></div>
            <div class="crop-handle tr"></div>
            <div class="crop-handle bl"></div>
            <div class="crop-handle br"></div>
          </div>
        </div>
      </div>

      <div class="edit-panel" id="edit-panel">
        <div class="edit-panel-grip" aria-hidden="true"></div>

        <!-- Sliders -->
        <div class="edit-sliders d-flex flex-column">
          <div class="edit-slider-row">
            <label class="slider-label" for="sl-brightness">Brilho</label>
            <div class="slider-track">
              <input type="range" min="50" max="200" value="100" class="edit-range" id="sl-brightness">
            </div>
          </div>
          <div class="edit-slider-row">
            <label class="slider-label" for="sl-contrast">Contraste</label>
            <div class="slider-track">
              <input type="range" min="50" max="200" value="100" class="edit-range" id="sl-contrast">
            </div>
          </div>
          <div class="edit-slider-row">
            <label class="slider-label" for="sl-saturation">Saturação</label>
            <div class="slider-track">
              <input type="range" min="0" max="200" value="100" class="edit-range" id="sl-saturation">
            </div>
          </div>
        </div>

        <!-- Ferramentas -->
        <div class="edit-tools-row d-flex justify-content-around">
          <button class="btn edit-tool-btn" id="btn-tool-crop">
            <i class="bi bi-crop"></i>
            <span>Recortar</span>
          </button>
          <button class="btn edit-tool-btn" id="btn-tool-rotate">
            <i class="bi bi-arrow-clockwise"></i>
            <span>Girar</span>
          </button>
          <button class="btn edit-tool-btn" id="btn-tool-grid">
            <i class="bi bi-grid-3x3"></i>
            <span>Grid</span>
          </button>
          <button class="btn edit-tool-btn" id="btn-tool-reset">
            <i class="bi bi-arrow-counterclockwise"></i>
            <span>Resetar</span>
          </button>
        </div>

      </div>
    </div>

    <!-- OVERLAY: LIGHTBOX (visualização individual) -->
    <div class="overlay hidden" id="overlay-lightbox">

      <div class="lightbox">
        <div class="lb-header d-flex justify-content-between align-items-center">
          <div>
            <div class="lb-name" id="lb-name">Foto</div>
            <div class="lb-date" id="lb-date"></div>
          </div>
          <button class="btn lb-close" id="btn-lb-close" aria-label="Fechar visualização"><i
              class="bi bi-x-lg"></i></button>
        </div>

        <div class="lb-image-area d-flex align-items-center justify-content-center">
          <button class="btn lb-nav-btn prev" id="btn-lb-prev" aria-label="Item anterior">
            <i class="bi bi-chevron-left"></i>
          </button>
          <div class="lb-img-wrap d-flex align-items-center justify-content-center">
            <img id="lb-img" src="" alt="" class="lb-img img-fluid">
            <div class="badge lb-shared-badge hidden d-flex align-items-center" id="lb-shared-badge">
              <i class="bi bi-link-45deg"></i> Compartilhado
            </div>
            <div class="lb-type-badge" id="lb-type-badge"></div>
          </div>
          <button class="btn lb-nav-btn next" id="btn-lb-next" aria-label="Próximo item">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>

        <div class="lb-actions d-flex justify-content-around align-items-center">
          <button class="btn lb-action-btn" id="btn-lb-fav" aria-label="Favoritar"><i class="bi bi-heart"
              id="lb-fav-icon"></i></button>
          <button class="btn lb-action-btn" id="btn-lb-edit" aria-label="Editar">
            <i class="bi bi-pencil"></i>
            <span>Editar</span>
          </button>
          <button class="btn lb-action-btn accent" id="btn-lb-share" aria-label="Compartilhar">
            <i class="bi bi-share"></i>
            <span>Compartilhar</span>
          </button>
          <button class="btn lb-action-btn danger" id="btn-lb-delete" aria-label="Excluir">
            <i class="bi bi-trash3"></i>
            <span>Excluir</span>
          </button>
        </div>
      </div>

    </div>


    <!-- OVERLAY: COMPARTILHAR (bottom sheet) -->
    <div class="overlay hidden" id="overlay-share">
      <div class="overlay-backdrop" id="share-backdrop"></div>
      <div class="bottom-sheet" id="share-sheet">
        <div class="sheet-grip"></div>
        <div class="sheet-title">COMPARTILHAR</div>
        <div class="sheet-subtitle" id="share-subtitle">Compartilhe suas fotos nas redes</div>

        <div class="share-platforms d-flex justify-content-between align-items-start">
          <button class="btn platform-btn" aria-label="Compartilhar no Instagram">
            <div class="platform-icon insta">
              <i class="bi bi-instagram"></i>
            </div>
            <span>Instagram</span>
          </button>
          <button class="btn platform-btn" aria-label="Compartilhar no TikTok">
            <div class="platform-icon tiktok">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.89 2.5 2.89 2.89 0 0 1-2.88-2.89 2.89 2.89 0 0 1 2.88-2.89c.28 0 .54.04.79.1V9.01a6.34 6.34 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.67a8.27 8.27 0 0 0 4.84 1.56V6.8a4.85 4.85 0 0 1-1.06-.11z" />
              </svg>
            </div>
            <span>TikTok</span>
          </button>
          <button class="btn platform-btn" aria-label="Compartilhar no WhatsApp">
            <div class="platform-icon whats">
              <i class="bi bi-whatsapp"></i>
            </div>
            <span>WhatsApp</span>
          </button>
          <button class="btn platform-btn" aria-label="Compartilhar no Facebook">
            <div class="platform-icon fb">
              <i class="bi bi-facebook"></i>
            </div>
            <span>Facebook</span>
          </button>
        </div>

        <div class="share-extra-actions">
          <button class="btn share-extra-btn story-btn w-100" id="btn-create-story">
            <i class="bi bi-play-circle"></i>
            Criar Story
          </button>
          <button class="btn share-extra-btn copy-btn w-100" id="btn-copy-link">
            <i class="bi bi-link-45deg"></i>
            Copiar Link
          </button>
        </div>

      </div>
    </div>


    <!-- OVERLAY: CONFIRMAR EXCLUSÃO -->
    <div class="overlay hidden" id="overlay-delete">
      <div class="overlay-backdrop" id="delete-backdrop"></div>
      <div class="bottom-sheet delete-sheet" id="delete-modal">
        <div class="sheet-grip" aria-hidden="true"></div>
        <h3 class="confirm-title">EXCLUIR</h3>
        <p class="confirm-desc">Tem certeza que deseja excluir <span id="del-count-text">este item</span>?</p>
        <div class="confirm-btns">
          <button class="btn confirm-btn danger w-100" id="btn-del-confirm">Confirmar</button>
          <button class="btn confirm-btn cancel w-100" id="btn-del-cancel">Cancelar</button>
        </div>
      </div>
    </div>


    <!-- TOAST -->
    <div id="toast-area"></div>

  </div><!-- #app -->

  <script src="app.js"></script>
</body>

</html>
